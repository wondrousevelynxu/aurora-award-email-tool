<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>极光表彰邮件生成器</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
  :root{
    --teal:#18AD91;--blue:#2477a8;--navy:#2c34b6;
    --bg:#f0f4f8;--card:#fff;--border:#e2e8f0;--text:#1e293b;--muted:#64748b;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);min-height:100vh;}
  .app{display:grid;grid-template-columns:var(--left-panel-width,460px) 8px 1fr;height:100vh;overflow:hidden;}
  .panel-left{overflow-y:auto;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;}
  .resize-handle{background:#e2e8f0;cursor:col-resize;position:relative;transition:background .2s;touch-action:none;}
  .resize-handle::after{content:"";position:absolute;top:50%;left:50%;width:2px;height:42px;border-radius:999px;background:#94a3b8;transform:translate(-50%,-50%);opacity:.55;}
  .resize-handle:hover,.resize-handle.dragging{background:#cbd5e1;}
  .panel-right{overflow:hidden;background:#e8ecf0;display:flex;flex-direction:column;}
  .left-header{padding:20px 24px 16px;background:linear-gradient(135deg,#18AD91,#2c34b6);color:#fff;flex-shrink:0;}
  .left-header h1{font-size:18px;font-weight:700;letter-spacing:1px;}
  .left-header p{font-size:12px;opacity:.8;margin-top:4px;}
  .section{padding:16px 24px;border-bottom:1px solid var(--border);}
  .section-label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
  .section-label span{width:3px;height:14px;background:var(--teal);border-radius:2px;display:inline-block;}
  .field{margin-bottom:12px;}
  .field label{font-size:12px;color:var(--muted);font-weight:600;display:block;margin-bottom:4px;}
  .field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;color:var(--text);background:#fff;outline:none;transition:border .2s;}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .person-list{display:flex;flex-direction:column;gap:8px;}
  .person-card{border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .person-card-header{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#f8fafc;user-select:none;}
  .person-avatar-thumb{width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#f8fafc;box-shadow:0 3px 10px rgba(15,23,42,.14);}
  .person-info{flex:1;min-width:0;}
  .person-name{font-size:13px;font-weight:600;color:var(--text);}
  .person-badge{font-size:11px;padding:2px 8px;border-radius:999px;background:linear-gradient(135deg,var(--teal),var(--navy));color:#fff;font-weight:600;}
  .person-card-body{padding:12px;border-top:1px solid var(--border);display:block;}
  .person-card-body.open{display:block;}
  .person-card-body .field{margin-bottom:8px;}
  .avatar-upload{display:flex;align-items:center;gap:12px;}
  .avatar-editor{width:96px;height:96px;border-radius:50%;background:#f8fafc;box-shadow:0 8px 22px rgba(15,23,42,.14);overflow:hidden;flex-shrink:0;cursor:grab;touch-action:none;position:relative;}
  .avatar-editor:active{cursor:grabbing;}
  .avatar-editor canvas{display:block;width:100%;height:100%;}
  .avatar-tools{flex:1;min-width:0;}
  .avatar-hint{font-size:11px;color:#94a3b8;margin-top:6px;line-height:1.5;}
  .avatar-action-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .avatar-zoom{width:100%;margin-top:10px;accent-color:var(--teal);}
  .import-box{border:1px dashed var(--border);border-radius:10px;background:#f8fafc;padding:12px;}
  .import-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .import-note{font-size:11px;color:#94a3b8;line-height:1.6;margin-top:8px;}
  .batch-box{border:1px solid var(--border);border-radius:8px;background:#f8fafc;padding:12px;}
  .batch-summary{font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:10px;}
  .batch-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .batch-actions .btn-secondary,.batch-actions .btn-download{width:100%;}
  .btn-upload{padding:6px 12px;background:#f1f5f9;border:1px solid var(--border);border-radius:6px;font-size:12px;cursor:pointer;color:var(--muted);}
  .btn-upload:hover{background:#e2e8f0;}
  .textarea-review{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:inherit;color:var(--text);resize:vertical;min-height:60px;outline:none;}
  .textarea-review:focus{border-color:var(--teal);}
  .btn-add{width:100%;padding:8px;border:2px dashed var(--border);border-radius:8px;background:none;font-size:13px;color:var(--muted);cursor:pointer;transition:all .2s;margin-top:4px;}
  .btn-add:hover{border-color:var(--teal);color:var(--teal);background:#f0faf8;}
  .btn-remove{padding:4px 8px;background:#fff0f0;border:1px solid #fecaca;border-radius:4px;font-size:11px;color:#ef4444;cursor:pointer;margin-left:auto;}
  .btn-remove:hover{background:#fee2e2;}
  .generate-bar{padding:16px 24px;border-top:1px solid var(--border);flex-shrink:0;background:#fff;}
  .btn-generate{width:100%;padding:14px;background:linear-gradient(135deg,#18AD91,#2c34b6);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:.5px;transition:opacity .2s;}
  .btn-generate:hover{opacity:.9;}
  .output-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
  .preview-bar{padding:12px 20px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0;}
  .preview-bar h2{font-size:13px;font-weight:600;color:var(--muted);margin-right:auto;}
  .btn-secondary,.btn-download{padding:8px 14px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;}
  .btn-secondary{background:#e2e8f0;color:#334155;}
  .btn-download{background:var(--teal);color:#fff;}
  .btn-download:hover{background:#15967e;}
  .preview-frame{flex:1;border:none;background:#fff;}
  .status{font-size:12px;color:var(--teal);font-weight:600;margin-top:6px;min-height:18px;}
  @media(max-width:900px){
    .app{grid-template-columns:1fr;height:auto;overflow:auto;}
    .panel-left{border-right:none;}
    .resize-handle{display:none;}
    .panel-right{height:720px;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="panel-left">
    <div class="left-header">
      <h1>极光表彰邮件生成器</h1>
      <p>纯前端版本：填写信息 -> 生成预览 -> 下载 HTML</p>
    </div>

    <div class="section">
      <div class="section-label"><span></span>导入 Excel</div>
      <div class="import-box">
        <div class="import-actions">
          <label class="btn-upload">上传 .xlsx<input type="file" accept=".xlsx,.xls" style="display:none" onchange="importExcel(this)"></label>
          <label class="btn-upload">批量上传头像<input type="file" accept="image/*" multiple style="display:none" onchange="importAvatarImages(this)"></label>
        </div>
        <div class="import-note">支持读取：部门、季度、奖金、远程天数、考勤有效期、HR，以及 S/A 名单。一个 Excel 可包含多个部门，批量头像会按头像文件名、姓名或“部门+姓名”自动匹配。</div>
      </div>
    </div>

    <div class="section">
      <div class="section-label"><span></span>按部门批量生成</div>
      <div class="batch-box">
        <div class="batch-summary" id="batch-summary">导入含“部门”列的 Excel 后，将自动按部门拆分生成文件。</div>
        <div class="field">
          <label>预览部门</label>
          <select id="batch_dept_select" onchange="previewDepartment(this.value)"></select>
        </div>
        <div class="batch-actions">
          <button class="btn-secondary" onclick="previewDepartment(document.getElementById('batch_dept_select').value)">预览此部门</button>
          <button class="btn-download" onclick="downloadDepartmentBundle()">下载部门文件包</button>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-label"><span></span>基本配置</div>
      <div class="field"><label>中文部门名</label><input id="dept_cn" value="XX部门"></div>
      <div class="field"><label>英文/展示部门名</label><input id="dept" value="XX Department"></div>
      <div class="field"><label>季度</label><input id="quarter" value="Q1"></div>
      <div class="field-row">
        <div class="field"><label>S级奖金（元）</label><input id="s_bonus" value="3500"></div>
        <div class="field"><label>A级奖金（元）</label><input id="a_bonus" value="2000"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>S级远程天数</label><input id="s_remote" value="2"></div>
        <div class="field"><label>A级远程天数</label><input id="a_remote" value="1"></div>
      </div>
      <div class="field"><label>考勤有效期</label><input id="date_range" value="5月1日-7月30日"></div>
      <div class="field"><label>HR 联系人</label><input id="hr_name" value="HR-XXX"></div>
    </div>

    <div class="section">
      <div class="section-label"><span></span>底部模板</div>
      <div class="field">
        <label>结尾鼓励语</label>
        <textarea id="closing_text" rows="3">感谢每一位在本季度辛勤付出的同事，愿大家以优秀为标杆，铆足干劲冲刺新程，解锁下一季度的 S/A 级 荣誉！</textarea>
      </div>
      <div class="field">
        <label>咨询说明模板</label>
        <textarea id="contact_text" rows="2">如有疑问，请联系 {{hr_name}}。</textarea>
      </div>
      <div class="field-row">
        <div class="field"><label>页脚第一行</label><input id="footer_line_1" value="2026 · 人力资源部 Aurora HR Department"></div>
        <div class="field"><label>页脚第二行</label><input id="footer_line_2" value="本邮件由系统自动发送，请勿直接回复"></div>
      </div>
      <div class="import-note">支持占位符：{{hr_name}}、{{quarter}}、{{dept_cn}}、{{dept}}、{{date_range}}。</div>
    </div>

    <div class="section">
      <div class="section-label"><span></span>S 级名单</div>
      <div class="person-list" id="s-list"></div>
      <button class="btn-add" onclick="addPerson('s')">+ 添加 S 级获奖人</button>
    </div>

    <div class="section">
      <div class="section-label"><span></span>A 级名单</div>
      <div class="person-list" id="a-list"></div>
      <button class="btn-add" onclick="addPerson('a')">+ 添加 A 级获奖人</button>
    </div>

    <div class="generate-bar">
      <button class="btn-generate" onclick="generate()">生成邮件预览</button>
      <div class="output-actions">
        <button class="btn-secondary" onclick="copyEmailHTML()">复制 HTML 文件内容</button>
        <button class="btn-download" onclick="downloadEmail()">下载 HTML 文件</button>
      </div>
      <div class="status" id="status"></div>
    </div>
  </div>

  <div class="resize-handle" title="拖动调整左侧编辑栏宽度，双击恢复默认" onpointerdown="startPanelResize(event)" ondblclick="resetPanelWidth()"></div>

  <div class="panel-right">
    <div class="preview-bar">
      <h2>邮件预览</h2>
      <button class="btn-secondary" onclick="copyEmailHTML()">复制 HTML 文件内容</button>
      <button class="btn-download" onclick="downloadEmail()">下载 HTML 文件</button>
    </div>
    <iframe class="preview-frame" id="preview"></iframe>
  </div>
</div>

<script>
const PRESET_S = [
  {name:"S级获奖人",dept:"XX部门",award:"季度之星",review:"请在此填写绩效评语。"}
];
const PRESET_A = [
  {name:"A级获奖人1",dept:"XX部门"},
  {name:"A级获奖人2",dept:"XX部门"},
  {name:"A级获奖人3",dept:"XX部门"}
];

let sPersons = [], aPersons = [], emailHTML = "";
let panelResize = null;
let selectedDepartmentKey = "";

function uid(){ return Math.random().toString(36).slice(2,8); }
function escapeHtml(value){
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[ch]));
}

function setInputValue(id, value){
  if(value === undefined || value === null || value === "") return;
  const el = document.getElementById(id);
  if(el) el.value = String(value).trim();
}

function normalizeHeader(value){
  return String(value ?? "").replace(/\s+/g, "").toLowerCase();
}

function pickValue(row, aliases){
  for(const key of Object.keys(row)){
    const normalized = normalizeHeader(key);
    if(aliases.some(alias => normalized === normalizeHeader(alias))){
      return row[key];
    }
  }
  return "";
}

function avatarMatchKey(value){
  return String(value ?? "")
    .replace(/\.[^.\\/]+$/, "")
    .replace(/[\s_\-()（）【】\[\]]+/g, "")
    .toLowerCase();
}

function getPersonDept(person){
  return String(person.dept || document.getElementById("dept_cn")?.value || "未填写部门").trim() || "未填写部门";
}

function safeFileName(value){
  return String(value || "未命名部门").trim().replace(/[\\/:*?"<>|]/g, "_").replace(/\s+/g, "_");
}

function clamp(value, min, max){
  return Math.min(Math.max(value, min), max);
}

function renderTemplate(template, data){
  const vars = {
    hr_name:data.hr_name,
    quarter:data.quarter,
    dept_cn:data.dept_cn,
    dept:data.dept,
    date_range:data.date_range
  };
  const rendered = String(template || "").replace(/\{\{\s*([a-zA-Z0-9_]+)\s*\}\}/g, (_, key) => vars[key] ?? "");
  return escapeHtml(rendered).replace(/\n/g, "<br>");
}

function getDepartmentGroups(){
  const groups = new Map();
  const addToGroup = (person, level) => {
    const deptName = getPersonDept(person);
    const key = avatarMatchKey(deptName) || deptName;
    if(!groups.has(key)){
      groups.set(key, {
        key,
        deptName,
        deptDisplay:person.deptDisplay || "",
        s_list:[],
        a_list:[]
      });
    }else if(person.deptDisplay && !groups.get(key).deptDisplay){
      groups.get(key).deptDisplay = person.deptDisplay;
    }
    groups.get(key)[level === "s" ? "s_list" : "a_list"].push(person);
  };
  sPersons.forEach(person => addToGroup(person, "s"));
  aPersons.forEach(person => addToGroup(person, "a"));
  return Array.from(groups.values()).sort((a, b) => a.deptName.localeCompare(b.deptName, "zh-CN"));
}

function buildDepartmentData(group){
  const base = collectData();
  return {
    ...base,
    title:`${group.deptName} 2026年${base.quarter}绩效表彰`,
    dept_cn:group.deptName,
    dept:group.deptDisplay || (group.deptName === base.dept_cn ? base.dept : group.deptName),
    s_list:group.s_list,
    a_list:group.a_list
  };
}

function updateDepartmentBatchUI(){
  const summary = document.getElementById("batch-summary");
  const select = document.getElementById("batch_dept_select");
  if(!summary || !select) return;
  const groups = getDepartmentGroups();
  const totalS = groups.reduce((sum, group) => sum + group.s_list.length, 0);
  const totalA = groups.reduce((sum, group) => sum + group.a_list.length, 0);
  summary.textContent = groups.length
    ? `已识别 ${groups.length} 个部门，共 S ${totalS} 位、A ${totalA} 位。下载文件包会为每个部门生成 1 个 HTML。`
    : "导入含“部门”列的 Excel 后，将自动按部门拆分生成文件。";
  const previousValue = select.value || selectedDepartmentKey;
  select.innerHTML = groups.map(group => `<option value="${escapeHtml(group.key)}">${escapeHtml(group.deptName)}（S ${group.s_list.length} / A ${group.a_list.length}）</option>`).join("");
  if(groups.some(group => group.key === previousValue)){
    select.value = previousValue;
  }else if(groups[0]){
    select.value = groups[0].key;
  }
  selectedDepartmentKey = select.value || "";
}

function getSelectedDepartmentGroup(){
  const groups = getDepartmentGroups();
  const selected = document.getElementById("batch_dept_select")?.value || selectedDepartmentKey;
  return groups.find(group => group.key === selected) || groups[0] || null;
}

function setLeftPanelWidth(width){
  const safeWidth = clamp(width, 340, Math.min(760, window.innerWidth - 360));
  document.documentElement.style.setProperty("--left-panel-width", `${safeWidth}px`);
  localStorage.setItem("awardToolLeftPanelWidth", String(safeWidth));
}

function loadLeftPanelWidth(){
  const saved = Number(localStorage.getItem("awardToolLeftPanelWidth"));
  if(saved) setLeftPanelWidth(saved);
}

function startPanelResize(event){
  event.preventDefault();
  const handle = event.currentTarget;
  handle.setPointerCapture(event.pointerId);
  handle.classList.add("dragging");
  panelResize = {
    pointerId:event.pointerId,
    startX:event.clientX,
    startWidth:document.querySelector(".panel-left").getBoundingClientRect().width,
    handle
  };
  handle.addEventListener("pointermove", resizePanel);
  handle.addEventListener("pointerup", stopPanelResize, {once:true});
  handle.addEventListener("pointercancel", stopPanelResize, {once:true});
}

function resizePanel(event){
  if(!panelResize || event.pointerId !== panelResize.pointerId) return;
  setLeftPanelWidth(panelResize.startWidth + event.clientX - panelResize.startX);
}

function stopPanelResize(event){
  if(!panelResize) return;
  panelResize.handle.releasePointerCapture(event.pointerId);
  panelResize.handle.removeEventListener("pointermove", resizePanel);
  panelResize.handle.classList.remove("dragging");
  panelResize = null;
}

function resetPanelWidth(){
  localStorage.removeItem("awardToolLeftPanelWidth");
  document.documentElement.style.setProperty("--left-panel-width", "460px");
}

function defaultAvatar(){
  const canvas = document.createElement("canvas");
  canvas.width = 200;
  canvas.height = 200;
  const ctx = canvas.getContext("2d");
  const gradient = ctx.createLinearGradient(0,0,200,200);
  gradient.addColorStop(0,"#18AD91");
  gradient.addColorStop(0.5,"#2477a8");
  gradient.addColorStop(1,"#2c34b6");
  ctx.fillStyle = gradient;
  ctx.fillRect(0,0,200,200);
  return canvas.toDataURL("image/jpeg", 0.85);
}

const avatarImageCache = new Map();
let avatarDrag = null;

function readFileAsDataURL(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => resolve(reader.result);
    reader.readAsDataURL(file);
  });
}

function loadAvatarImage(src){
  if(avatarImageCache.has(src)) return Promise.resolve(avatarImageCache.get(src));
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onerror = reject;
    img.onload = () => {
      avatarImageCache.set(src, img);
      resolve(img);
    };
    img.src = src;
  });
}

async function drawAvatarToCanvas(person, canvas){
  const size = canvas.width || 200;
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, size, size);

  if(!person.avatarOriginal){
    const img = await loadAvatarImage(person.avatar || defaultAvatar());
    ctx.drawImage(img, 0, 0, size, size);
    return;
  }

  const img = await loadAvatarImage(person.avatarOriginal);
  const baseScale = Math.max(size / img.width, size / img.height);
  const zoom = Number(person.avatarScale || 1);
  constrainAvatarTransform(person, img, size);
  const drawW = img.width * baseScale * zoom;
  const drawH = img.height * baseScale * zoom;
  const dx = (size - drawW) / 2 + Number(person.avatarX || 0) * (size / 200);
  const dy = (size - drawH) / 2 + Number(person.avatarY || 0) * (size / 200);
  ctx.drawImage(img, dx, dy, drawW, drawH);
}

function constrainAvatarTransform(person, img, size=200){
  const baseScale = Math.max(size / img.width, size / img.height);
  const zoom = Number(person.avatarScale || 1);
  const drawW = img.width * baseScale * zoom;
  const drawH = img.height * baseScale * zoom;
  const limitX = Math.max(0, (drawW - size) / 2) * (200 / size);
  const limitY = Math.max(0, (drawH - size) / 2) * (200 / size);
  person.avatarX = clamp(Number(person.avatarX || 0), -limitX, limitX);
  person.avatarY = clamp(Number(person.avatarY || 0), -limitY, limitY);
}

async function detectAvatarFocus(src, img){
  if("FaceDetector" in window && "createImageBitmap" in window){
    try{
      const blob = await (await fetch(src)).blob();
      const bitmap = await createImageBitmap(blob);
      const detector = new FaceDetector({maxDetectedFaces:1, fastMode:true});
      const faces = await detector.detect(bitmap);
      bitmap.close();
      if(faces.length){
        const face = faces.sort((a, b) => (b.boundingBox.width * b.boundingBox.height) - (a.boundingBox.width * a.boundingBox.height))[0];
        const box = face.boundingBox;
        return {
          x: box.x + box.width / 2,
          y: box.y + box.height / 2,
          box,
          type: "face"
        };
      }
    }catch(err){}
  }
  return {x: img.width / 2, y: img.height * 0.42, box:null, type:"composition"};
}

async function autoCenterAvatar(person){
  if(!person.avatarOriginal) return;
  const img = await loadAvatarImage(person.avatarOriginal);
  const focus = await detectAvatarFocus(person.avatarOriginal, img);
  const size = 200;
  const baseScale = Math.max(size / img.width, size / img.height);
  let zoom = 1;
  if(focus.box && focus.box.height){
    zoom = clamp(86 / (focus.box.height * baseScale), 1, 2.3);
  }
  person.avatarScale = Number(zoom.toFixed(2));
  const drawW = img.width * baseScale * person.avatarScale;
  const drawH = img.height * baseScale * person.avatarScale;
  const drawScale = baseScale * person.avatarScale;
  person.avatarX = 100 - (size - drawW) / 2 - focus.x * drawScale;
  person.avatarY = 100 - (size - drawH) / 2 - focus.y * drawScale;
  constrainAvatarTransform(person, img, size);
  person.avatarAuto = focus.type;
}

async function updateAvatarCrop(person){
  const canvas = document.createElement("canvas");
  canvas.width = 200;
  canvas.height = 200;
  await drawAvatarToCanvas(person, canvas);

}

async function importAvatarImages(input){
  const files = Array.from(input.files || []);
  if(!files.length) return;

  const personByKey = new Map();
  sPersons.forEach(person => {
    const dept = getPersonDept(person);
    [person.avatarFile, person.name, `${dept}${person.name}`, `${person.name}${dept}`].forEach(value => {
      const key = avatarMatchKey(value);
      if(key && !personByKey.has(key)) personByKey.set(key, person);
    });
  });

  let matched = 0;
  const unmatched = [];
  for(const file of files){
    const fileKey = avatarMatchKey(file.name);
    let person = personByKey.get(fileKey);
    if(!person){
      const candidates = sPersons.filter(item => {
        const nameKey = avatarMatchKey(item.name);
        const deptKey = avatarMatchKey(getPersonDept(item));
        return nameKey && fileKey.includes(nameKey) && (!deptKey || fileKey.includes(deptKey));
      });
      person = candidates.length === 1 ? candidates[0] : null;
    }
    if(!person){
      const candidates = sPersons.filter(item => {
        const nameKey = avatarMatchKey(item.name);
        return nameKey && fileKey.includes(nameKey);
      });
      person = candidates.length === 1 ? candidates[0] : null;
    }
    if(!person){
      unmatched.push(file.name);
      continue;
    }
    await setPersonAvatarFromFile(person, file);
    matched += 1;
  }

  renderList("s");
  generate();
  const msg = unmatched.length ? `，未匹配：${unmatched.slice(0, 5).join("、")}${unmatched.length > 5 ? "等" : ""}` : "";
  document.getElementById("status").textContent = `已自动匹配头像 ${matched}/${files.length} 张${msg}。`;
  input.value = "";
}

async function updateAvatarZoom(id, value){
  const person = findSPerson(id);
  if(!person) return;
  person.avatarScale = Number(value);
  await updateAvatarCrop(person);
  renderAvatarEditors("s");
  const thumb = document.getElementById("thumb-" + id);
  if(thumb) thumb.src = person.avatar;
  generate();
}

function startAvatarDrag(event, id){
  const person = findSPerson(id);
  if(!person || !person.avatarOriginal) return;
  event.preventDefault();
  const editor = event.currentTarget;
  editor.setPointerCapture(event.pointerId);
  avatarDrag = {
    id,
    pointerId:event.pointerId,
    lastX:event.clientX,
    lastY:event.clientY,
    editor
  };
  editor.addEventListener("pointermove", dragAvatar);
  editor.addEventListener("pointerup", stopAvatarDrag, {once:true});
  editor.addEventListener("pointercancel", stopAvatarDrag, {once:true});
}

async function dragAvatar(event){
  if(!avatarDrag || event.pointerId !== avatarDrag.pointerId) return;
  const person = findSPerson(avatarDrag.id);
  if(!person) return;
  const rect = avatarDrag.editor.getBoundingClientRect();
  const ratio = 200 / rect.width;
  person.avatarX += (event.clientX - avatarDrag.lastX) * ratio;
  person.avatarY += (event.clientY - avatarDrag.lastY) * ratio;
  avatarDrag.lastX = event.clientX;
  avatarDrag.lastY = event.clientY;
  await updateAvatarCrop(person);
  renderAvatarEditors("s");
  const thumb = document.getElementById("thumb-" + person.id);
  if(thumb) thumb.src = person.avatar;
  generate();
}

function stopAvatarDrag(event){
  if(!avatarDrag) return;
  avatarDrag.editor.releasePointerCapture(event.pointerId);
  avatarDrag.editor.removeEventListener("pointermove", dragAvatar);
  avatarDrag = null;
}

function parseConfigRows(rows){
  rows.forEach(row => {
    const key = normalizeHeader(row[0]);
    const value = row[1];
    if(["级别","姓名","level","name"].includes(key)) return;
    if(!key || value === undefined || value === null || value === "") return;
    if(["中文部门名","部门中文名","部门","主标题部门名","deptcn"].includes(key)) setInputValue("dept_cn", value);
    if(["英文部门名","展示部门名","部门英文名","副标题英文部门","dept","department"].includes(key)) setInputValue("dept", value);
    if(["季度","quarter"].includes(key)) setInputValue("quarter", value);
    if(["s级奖金","s奖金","s_bonus","sbonus"].includes(key)) setInputValue("s_bonus", value);
    if(["a级奖金","a奖金","a_bonus","abonus"].includes(key)) setInputValue("a_bonus", value);
    if(["s级远程天数","s远程天数","s_remote","sremote"].includes(key)) setInputValue("s_remote", value);
    if(["a级远程天数","a远程天数","a_remote","aremote"].includes(key)) setInputValue("a_remote", value);
    if(["考勤有效期","有效期","daterange","date_range"].includes(key)) setInputValue("date_range", value);
    if(["hr联系人","hr","联系人","hr_name","hrname"].includes(key)) setInputValue("hr_name", value);
    if(["结尾鼓励语","底部结尾","closingtext","closing_text"].includes(key)) setInputValue("closing_text", value);
    if(["咨询说明","联系说明","contacttext","contact_text"].includes(key)) setInputValue("contact_text", value);
    if(["页脚第一行","footerline1","footer_line_1"].includes(key)) setInputValue("footer_line_1", value);
    if(["页脚第二行","footerline2","footer_line_2"].includes(key)) setInputValue("footer_line_2", value);
  });
}

function findPeopleSheet(workbook){
  const preferred = workbook.SheetNames.find(name => /名单|people|award|list/i.test(name));
  return preferred || workbook.SheetNames[0];
}

function importPeopleRows(rows){
  resetPeople();
  rows.forEach(row => {
    const rawLevel = String(pickValue(row, ["级别","绩效级别","level","等级"]) || "").toUpperCase();
    const name = String(pickValue(row, ["姓名","name","员工姓名"]) || "").trim();
    if(!name) return;
    const dept = String(pickValue(row, ["部门","dept","department"]) || "").trim();
    const deptDisplay = String(pickValue(row, ["展示部门名","英文部门名","部门英文名","副标题部门","displaydept","displaydepartment"]) || "").trim();
    const award = String(pickValue(row, ["奖项","award"]) || "季度之星").trim();
    const review = String(pickValue(row, ["评语","绩效评语","review","comment"]) || "").trim();
    const avatarFile = String(pickValue(row, ["头像文件名","头像","avatar","avatarfile","图片文件名"]) || "").trim();
    if(rawLevel.includes("A")){
      addPerson("a", {name, dept, deptDisplay, avatarFile});
    }else{
      addPerson("s", {name, dept, deptDisplay, award, review, avatarFile});
    }
  });
}

function hasSectionedAwardRows(rows){
  return rows.some(row => /S\s*级获奖名单|A\s*级获奖名单/i.test(String(row[0] || "")));
}

function importSectionedAwardRows(rows){
  resetPeople();
  let mode = "";
  rows.forEach(row => {
    const marker = String(row[0] || "").trim();
    if(/S\s*级获奖名单/i.test(marker)){
      mode = "s";
      return;
    }
    if(/A\s*级获奖名单/i.test(marker)){
      mode = "a";
      return;
    }
    if(!mode || !marker || marker === "姓名" || marker.startsWith("（")) return;

    const name = String(row[0] || "").trim();
    const dept = String(row[1] || "").trim();
    const deptDisplay = String(row[5] || "").trim();
    if(!name) return;

    if(mode === "s"){
      addPerson("s", {
        name,
        dept,
        deptDisplay,
        award:String(row[2] || "季度之星").trim(),
        review:String(row[3] || "").trim(),
        avatarFile:String(row[4] || "").trim()
      });
    }else{
      addPerson("a", {name, dept, deptDisplay, avatarFile:String(row[4] || "").trim()});
    }
  });
}

async function importExcel(input){
  const file = input.files[0];
  if(!file) return;
  if(!window.XLSX){
    document.getElementById("status").textContent = "Excel 解析库加载失败，请检查网络后重试。";
    return;
  }
  const buffer = await file.arrayBuffer();
  const workbook = XLSX.read(buffer, {type:"array"});
  const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
  const firstRows = XLSX.utils.sheet_to_json(firstSheet, {header:1, blankrows:false, defval:""});

  if(workbook.Sheets["配置"]){
    parseConfigRows(XLSX.utils.sheet_to_json(workbook.Sheets["配置"], {header:1, blankrows:false}));
  }else{
    parseConfigRows(firstRows.slice(0, 20));
  }

  if(hasSectionedAwardRows(firstRows)){
    importSectionedAwardRows(firstRows);
  }else{
    const peopleSheetName = workbook.Sheets["名单"] ? "名单" : findPeopleSheet(workbook);
    const peopleRows = XLSX.utils.sheet_to_json(workbook.Sheets[peopleSheetName], {defval:""});
    importPeopleRows(peopleRows);
  }

  const first = sPersons[0];
  if(first){
    const body = document.getElementById("body-" + first.id);
    if(body) body.classList.add("open");
  }
  generate();
  document.getElementById("status").textContent = `已从 ${file.name} 导入：S ${sPersons.length} 位，A ${aPersons.length} 位。`;
  input.value = "";
}

  }).join("");

  const sSection = data.s_list.length ? `
    <div class="section-title-s"><span class="highlight-s">绩效 S 级</span></div>
    <div class="awardee-list">${sCards}</div>
    <div class="reward-notice">
      <p class="reward-notice__lead">恭喜以上同学获得 <span class="highlight-s">绩效S</span> 奖励：</p>
      <ol class="reward-notice__list">
        <li>管理先锋/季度之星 奖金 RMB ${escapeHtml(data.s_bonus)} ，随工资合并计税发放；</li>
        <li>远程办公 &nbsp;${escapeHtml(data.s_remote)}&nbsp; 天，详见考勤特权使用说明；</li>
        <li>&nbsp;${escapeHtml(data.date_range)} 期间弹性考勤，详见考勤特权使用说明。</li>
      </ol>
    </div>` : "";

  const aSection = data.a_list.length ? `
    ${data.s_list.length ? '<hr class="divider">' : ''}
    <div class="a-level-module">
      <div class="section-title-a"><span class="highlight-a">绩效 A 级</span></div>
      <ul class="a-level-name-list">${data.a_list.map(p => `<li><span style="width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,#18AD91,#2477a8);display:inline-block;flex-shrink:0;"></span><span>${escapeHtml(p.name)}</span></li>`).join("")}</ul>
      <div class="reward-notice">
        <p class="reward-notice__lead">恭喜以上同学获得 <span class="highlight-a">绩效A</span> 奖励：</p>
        <ol class="reward-notice__list">
          <li>绩优绩效奖金 RMB ${escapeHtml(data.a_bonus)} ，随工资合并计税发放；</li>
          <li>远程办公 &nbsp;${escapeHtml(data.a_remote)}&nbsp; 天，详见考勤特权使用说明。</li>
        </ol>
      </div>
    </div>` : "";

  return `<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>${escapeHtml(data.title)}</title>
<style>${emailCss()}</style>
</head>
<body>
<div class="email-wrapper"><div class="email-container">
  <div class="header-banner">
    <h1 class="title">${escapeHtml(data.title)}</h1>
    <div class="subtitle">${escapeHtml(data.quarter)} 2026 Performance Recognition（${escapeHtml(data.dept)}）</div>
  </div>
  <div class="email-body">
    <p class="greeting">Dear，<br>经绩效评审，以下同学评为 S/A，现予以部门公开表彰，以资鼓励！让我们对以下小伙伴表示热烈祝贺！</p>
    ${sSection}
    ${aSection}
    <hr class="divider">
    ${buildAttendanceGuide(data)}
    <hr class="divider">
    ${String(data.closing_text || "").trim() ? `<p class="closing-text">${renderTemplate(data.closing_text, data)}</p>` : ""}
    ${String(data.contact_text || "").trim() ? `<p class="contact-text">${renderTemplate(data.contact_text, data)}</p>` : ""}
  </div>
  <div class="email-footer">
    ${String(data.footer_line_1 || "").trim() ? `<p>${renderTemplate(data.footer_line_1, data)}</p>` : ""}
    ${String(data.footer_line_2 || "").trim() ? `<p>${renderTemplate(data.footer_line_2, data)}</p>` : ""}
  </div>
</div></div>
</body></html>`;
}

function collectData(){
  return {
    title: `${document.getElementById("dept_cn").value} 2026年${document.getElementById("quarter").value}绩效表彰`,
    dept_cn: document.getElementById("dept_cn").value,
    dept: document.getElementById("dept").value,
    quarter: document.getElementById("quarter").value,
    s_bonus: document.getElementById("s_bonus").value,
    a_bonus: document.getElementById("a_bonus").value,
    s_remote: document.getElementById("s_remote").value,
    a_remote: document.getElementById("a_remote").value,
    date_range: document.getElementById("date_range").value,
    hr_name: document.getElementById("hr_name").value,
    closing_text: document.getElementById("closing_text").value,
    contact_text: document.getElementById("contact_text").value,
    footer_line_1: document.getElementById("footer_line_1").value,
    footer_line_2: document.getElementById("footer_line_2").value,
    s_list: sPersons,
    a_list: aPersons
  };
}

function previewDepartment(key){
  selectedDepartmentKey = key || "";
  const group = getSelectedDepartmentGroup();
  if(!group){
    generate();
    return;
  }
  emailHTML = buildEmail(buildDepartmentData(group));
  document.getElementById("preview").srcdoc = emailHTML;
  document.getElementById("status").textContent = `正在预览：${group.deptName}。`;
  updateDepartmentBatchUI();
}

function generate(){
  updateDepartmentBatchUI();
  const group = getSelectedDepartmentGroup();
  emailHTML = group ? buildEmail(buildDepartmentData(group)) : buildEmail(collectData());
  document.getElementById("preview").srcdoc = emailHTML;
  document.getElementById("status").textContent = group ? `生成成功，当前预览：${group.deptName}。` : "生成成功，所有处理均在浏览器本地完成。";
}

function downloadBlob(blob, fileName){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = fileName;
  a.click();
  URL.revokeObjectURL(a.href);
}

function downloadEmail(){
  if(!emailHTML) generate();
  const group = getSelectedDepartmentGroup();
  const dept = group ? group.deptName : (document.getElementById("dept_cn").value.trim() || "极光表彰");
  const quarter = document.getElementById("quarter").value.trim() || "Q";
  downloadBlob(new Blob([emailHTML], {type:"text/html;charset=utf-8"}), `${safeFileName(dept)}_${quarter}_绩效表彰邮件.html`);
  document.getElementById("status").textContent = "HTML 文件已下载。";
}

async function downloadDepartmentBundle(){
  const groups = getDepartmentGroups();
  if(!groups.length){
    document.getElementById("status").textContent = "还没有可生成的部门，请先导入 Excel。";
    return;
  }
  const quarter = document.getElementById("quarter").value.trim() || "Q";
  if(window.JSZip){
    const zip = new JSZip();
    groups.forEach(group => {
      zip.file(`${safeFileName(group.deptName)}_${quarter}_绩效表彰邮件.html`, buildEmail(buildDepartmentData(group)));
    });
    const blob = await zip.generateAsync({type:"blob"});
    downloadBlob(blob, `${quarter}_部门绩效表彰邮件.zip`);
    document.getElementById("status").textContent = `已生成 ${groups.length} 个部门文件并打包下载。`;
    return;
  }
  groups.forEach(group => {
    const html = buildEmail(buildDepartmentData(group));
    downloadBlob(new Blob([html], {type:"text/html;charset=utf-8"}), `${safeFileName(group.deptName)}_${quarter}_绩效表彰邮件.html`);
  });
  document.getElementById("status").textContent = `JSZip 加载失败，已尝试分别下载 ${groups.length} 个 HTML 文件。`;
}

async function copyEmailHTML(){
  if(!emailHTML) generate();
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(emailHTML);
    }else{
      const textarea = document.createElement("textarea");
      textarea.value = emailHTML;
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      document.execCommand("copy");
      textarea.remove();
    }
    document.getElementById("status").textContent = "HTML 文件内容已复制，可粘贴到邮件源码模式。";
  }catch(err){
    document.getElementById("status").textContent = "复制失败，请点击下载 HTML 文件后使用。";
  }
}

window.onload = () => {
  loadLeftPanelWidth();
  PRESET_S.forEach(d => addPerson("s", d));
  PRESET_A.forEach(d => addPerson("a", d));
  const first = sPersons[0];
  if(first){
    const body = document.getElementById("body-" + first.id);
    if(body) body.classList.add("open");
  }
  generate();
};
</script>
